uantidade_raw = params[:quantidade_refeicoes]","","    # 1. Validacao de presenca do metodo de pagamento","    if metodo.blank?","      flash.now[:alert] = \"Selecione uma forma de pagamento\"","      preparar_dados_view","      return render :new, status: :unprocessable_entity","    end","","    # 2. Validacao de formato numerico (aceita inteiros positivos ou negativos)","    unless quantidade_valida?(quantidade_raw)","      flash.now[:alert] = \"Informe uma quantidade numérica válida\"","      preparar_dados_view","      return render :new, status: :unprocessable_entity","    end","","    quantidade = quantidade_raw.to_i","","    # 3. Validacao dos limites de negocio (minimo 1, maximo 100 refeicoes)","    if quantidade \u003c 1","      flash.now[:alert] = \"A quantidade mínima é de 1 refeição\"","      preparar_dados_view","      return render :new, status: :unprocessable_entity","    elsif quantidade > 100","      flash.now[:alert] = \"A quantidade máxima é de 100 refeições\"","      preparar_dados_view","      return render :new, status: :unprocessable_entity","    end","","    valor_total_centavos = quantidade * TARIFA_UNITARIA_CENTAVOS","","    # 4. Direcionamento do fluxo de acordo com a forma de pagamento escolhida","    if metodo == \"Cartão de Crédito\"","      processar_cartao(quantidade, valor_total_centavos)","    else","      processar_pix(quantidade, valor_total_centavos)","    end","  end","","  # GET /recargas/:id","  # Exibe os detalhes do PIX gerado (QR Code e chave Copia-e-Cola)","  def show","    @usuario = current_user","    @carteira = @usuario.carteira","  end","","  # POST /recargas/:id/confirmar","  # Acao que simula a liquidacao bancaria do PIX (aprovado ou expirado)","  def confirmar","    if params[:expirado] == \"true\"","      # Cenário triste: prazo expirou sem pagamento","      @recarga.update(status: \"cancelada\")","      flash[:alert] = \"Pagamento não confirmado\"","      redirect_to new_recarga_path","    else","      # Cenário feliz: transacao atomica garantindo integridade ACID","      ActiveRecord::Base.transaction do","        @recarga.update!(status: \"paga\")","        @recarga.carteira.increment!(:saldo_centavos, @recarga.valor_centavos)","      end","      flash[:notice] = \"Recarga realizada com sucesso\"","      redirect_to new_recarga_path","    end","  end","","  private","","  def set_recarga","    @recarga = current_user.recargas.find(params[:id])","  end","","  # Regex que verifica se a string informada representa um numero inteiro","  def quantidade_valida?(raw)","    return false if raw.blank?","    raw.to_s.strip.match?(/\\A-?\\d+\\z/)","  end","","  # Reconstroi o estado visual para renderizar a view caso ocorram erros de validacao","  def preparar_dados_view","    @saldo_refeicoes = (@carteira&.saldo_centavos || 0) / TARIFA_UNITARIA_CENTAVOS","    @quantidade = 5","    @total_formatado = \"22,50\"","    @novo_saldo_refs = @saldo_refeicoes + 5","    @recarga = Recarga.new","  end","","  # Processa o pagamento via cartao simulando cenarios de aprovacao e recusa","  def processar_cartao(quantidade, valor_centavos)","    cartao_status = params[:cartao_status] || \"valido\"","","    if cartao_status == \"vencido\"","      flash.now[:alert] = \"Cartão vencido\"","      preparar_dados_view","      render :new, status: :unprocessable_entity","    elsif cartao_status == \"recusado\"","      flash.now[:alert] = \"Pagamento recusado\"","      preparar_dados_view","      render :new, status: :unprocessable_entity","    else","      # Cartao valido: transacao atomica creditando a carteira imediatamente","      ActiveRecord::Base.transaction do","        @recarga = @usuario.recargas.create!(","          carteira: @carteira,","          quantidade_refeicoes: quantidade,","          valor_centavos: valor_centavos,","          status: \"paga\",","          metodo_pagamento: \"Cartão de Crédito\"","        )","        @carteira.increment!(:saldo_centavos, valor_centavos)","      end","      flash[:notice] = \"Recarga realizada com sucesso\"","      redirect_to new_recarga_path","    end","  end","","  # Cria o registro de recarga pendente com txid exclusivo e direciona para a tela do PIX","  def processar_pix(quantidade, valor_centavos)","    txid = \"PIX-#{SecureRandom.hex(8).upcase}\"","    @recarga = @usuario.recargas.create!(","      carteira: @carteira,","      quantidade_refeicoes: quantidade,","      valor_centavos: valor_centavos,","      status: \"pendente\",","      metodo_pagamento: \"PIX Instantâneo\",","      txid_pix: txid","    )","    redirect_to recarga_path(@recarga)","  end","end"],"lines":[null,null,1,1,1,null,null,1,null,null,null,1,3,3,3,3,null,null,3,3,3,3,null,3,null,null,null,null,1,8,8,8,null,8,8,null,null,8,1,1,1,null,null,null,7,1,1,1,null,null,6,null,null,6,1,1,1,5,1,1,1,null,null,4,null,null,4,3,null,1,null,null,null,null,null,1,1,1,null,null,null,null,1,2,null,1,1,1,null,null,1,1,1,null,1,1,null,null,null,1,null,1,4,null,null,null,1,7,7,null,null,null,1,6,6,6,6,6,null,null,null,1,3,null,3,1,1,1,2,1,1,1,null,null,1,1,null,null,null,null,null,null,1,null,1,1,null,null,null,null,1,1,1,null,null,null,null,null,null,null,1,null,null],"lines_covered_percent":100.0,"covered_lines":85,"missed_lines":0,"omitted_lines":78,"total_lines":85,"branches":[],"branches_covered_percent":100.0,"covered_branches":0,"missed_branches":0,"total_branches":0},"app/controllers/restaurantes_controller.rb":{"source":["class RestaurantesController \u003c ApplicationController","  include ControleDeAcesso","  before_action :exigir_administrador","  before_action :carregar_restaurante, only: %i[edit update destroy]","","  def index","    carregar_gestao","    @restaurante = Restaurante.new","    @catraca = Catraca.new","  end","","  def create","    @restaurante = Restaurante.new(restaurante_params)","    if @restaurante.save","      redirect_to restaurantes_path, notice: \"Restaurante cadastrado com sucesso\"","    else","      carregar_gestao"," ====================","# Service Gerador de PDF do Extrato (app/services/extrato_pdf_generator.rb)","# ==============================================================================","# Constrói o extrato oficial e timbrado em formato PDF utilizando a gem Prawn.","# O documento contém:","# 1. Cabeçalho Institucional (UnB / RU Digital)","# 2. Dados do Estudante e Saldo Atual","# 3. Quadro de Resumo Contábil (Total Gasto, Refeições Realizadas e Total Recarregado)","# 4. Tabela Zebrada de Lançamentos (Data/Hora, Evento, Restaurante, Acesso e Valor)","# 5. Rodapé Institucional com timestamp de emissão","# ==============================================================================","class ExtratoPdfGenerator","  Prawn::Fonts::AFM.hide_m17n_warning = true if defined?(Prawn::Fonts::AFM)","","  attr_reader :usuario, :extrato_service, :lancamentos","","  def initialize(usuario:, extrato_service:)","    @usuario = usuario","    @extrato_service = extrato_service","    @lancamentos = extrato_service.lancamentos","  end","","  # Gera o binário do PDF renderizado","  def gerar","    pdf = Prawn::Document.new(","      page_size: \"A4\",","      margin: [ 36, 36, 36, 36 ],","      compress: false","    )","","    desenhar_cabecalho(pdf)","    desenhar_dados_estudante(pdf)","    desenhar_quadro_resumo(pdf)","    desenhar_tabela_lancamentos(pdf)","    desenhar_rodape(pdf)","","    pdf.render","  end","","  private","","  # 1. Cabeçalho Institucional com brasão textual da UnB","  def desenhar_cabecalho(pdf)","    pdf.fill_color \"044B2C\"","    pdf.text normalizar(\"UNIVERSIDADE DE BRASÍLIA — UnB\"), size: 14, style: :bold, align: :center","    pdf.fill_color \"1E293B\"","    pdf.text normalizar(\"Diretoria de Desenvolvimento Social — Restaurante Universitário\"), size: 10, align: :center","    pdf.text normalizar(\"PORTAL DO ESTUDANTE | EXTRATO E HISTÓRICO DE REFEIÇÕES\"), size: 9, style: :bold, align: :center, color: \"0284C7\"","    pdf.move_down 10","    pdf.stroke_color \"E2E8F0\"","    pdf.stroke_horizontal_rule","    pdf.move_down 12","  end","","  # 2. Dados Cadastrais do Estudante e Saldo","  def desenhar_dados_estudante(pdf)","    pdf.fill_color \"0F172A\"","    pdf.text normalizar(\"DADOS DO ESTUDANTE\"), size: 10, style: :bold","    pdf.move_down 4","","    pdf.font_size 9 do","      pdf.text normalizar(\"Nome: #{@usuario.nome}  |  Matrícula: #{@usuario.matricula}  |  E-mail: #{@usuario.email}\")","      pdf.text normalizar(\"Data de Emissão: #{Time.current.strftime('%d/%m/%Y às %H:%M')}  |  Saldo Atual: #{extrato_service.saldo_atual_formatado} (#{extrato_service.saldo_atual_refeicoes} refeições)\")","    end","","    pdf.move_down 10","    pdf.stroke_horizontal_rule","    pdf.move_down 10","  end","","  # 3. Quadro de Resumo Contábil (Total Gasto, Refeições Realizadas, Total Recarregado)","  def desenhar_quadro_resumo(pdf)","    pdf.fill_color \"0F172A\"","    pdf.text normalizar(\"RESUMO DO PERÍODO\"), size: 10, style: :bold","    pdf.move_down 6","","    # Texto legível e direto para atender às asserções do BDD","    total_gasto = extrato_service.total_gasto_formatado","    refeicoes = \"#{extrato_service.refeicoes_realizadas_count} refeicoes\"","    recarregado = extrato_service.total_recarregado_formatado","","    pdf.fill_color \"F8FAFC\"","    pdf.fill_rounded_rectangle [ 0, pdf.cursor ], 523, 38, 4","    pdf.fill_color \"1E293B\"","","    pdf.bounding_box([ 10, pdf.cursor - 8 ], width: 503, height: 26) do","      pdf.font_size 9 do","        texto_resumo = normalizar(\"Total Gasto: #{total_gasto}    |    Refeições Realizadas: #{refeicoes}    |    Total Recarregado: #{recarregado}\")","        pdf.text texto_resumo, style: :bold","      end","    end","","    pdf.move_down 12","    pdf.stroke_horizontal_rule","    pdf.move_down 10","  end","","  # 4. Tabela de Lançamentos Formatada","  def desenhar_tabela_lancamentos(pdf)","    pdf.fill_color \"0F172A\"","    pdf.text \"LANCAMENTOS REGISTRADOS (#{lancamentos.size})\", size: 10, style: :bold","    pdf.move_down 6","","    # Cabeçalho da Tabela","    y_pos = pdf.cursor","    pdf.fill_color \"F1F5F9\"","    pdf.fill_rectangle [ 0, y_pos ], 523, 18","    pdf.fill_color \"334155\"","","    pdf.font_size 8 do","      pdf.draw_text normalizar(\"Data e Hora\"), at: [ 6, y_pos - 13 ], style: :bold","      pdf.draw_text normalizar(\"Refeição ou Evento\"), at: [ 115, y_pos - 13 ], style: :bold","      pdf.draw_text normalizar(\"Restaurante\"), at: [ 235, y_pos - 13 ], style: :bold","      pdf.draw_text normalizar(\"Método de Acesso\"), at: [ 350, y_pos - 13 ], style: :bold","      pdf.draw_text normalizar(\"Valor\"), at: [ 480, y_pos - 13 ], style: :bold","    end","","    pdf.move_down 20","","    # Linhas dos Lançamentos","    lancamentos.each_with_index do |lancamento, idx|","      # Quebra de página automática quando atinge a margem inferior","      if pdf.cursor \u003c 40","        pdf.start_new_page","        pdf.move_down 10","      end","","      y = pdf.cursor","","      # Efeito zebrado sutil nas linhas pares","      if idx.even?","        pdf.fill_color \"FAFAFA\"","        pdf.fill_rectangle [ 0, y ], 523, 16","      end","","      # Cor do valor: verde para créditos (+) e neutro/escuro para débitos (-)","      pdf.fill_color \"1E293B\"","      pdf.font_size 8 do","        pdf.draw_text normalizar(lancamento.data_formatada), at: [ 6, y - 11 ]","        pdf.draw_text normalizar(lancamento.evento), at: [ 115, y - 11 ]","        pdf.draw_text normalizar(lancamento.restaurante), at: [ 235, y - 11 ]","        pdf.draw_text normalizar(lancamento.forma_acesso), at: [ 350, y - 11 ]","","        if lancamento.credito?","          pdf.fill_color \"16A34A\"","        else","          pdf.fill_color \"0F172A\"","        end","        pdf.draw_text normalizar(lancamento.valor_formatado), at: [ 465, y - 11 ], style: :bold","      end","","      pdf.move_down 16","    end","  end","","  # Normaliza caracteres para a fonte padrão AFM do Prawn","  def normalizar(str)","    str.to_s.tr(\"áàãâéêíóôõúçÁÀÃÂÉÊÍÓÔÕÚÇ\", \"aaaaeeioooucAAAAEEIOOOUC\")","  end","","  # 5. Rodapé de Autenticação e Segurança","  def desenhar_rodape(pdf)","    pdf.move_down 15","    pdf.stroke_color \"E2E8F0\"","    pdf.stroke_horizontal_rule","    pdf.move_down 6","","    pdf.font_size 7 do","      pdf.fill_color \"94A3B8\"","      pdf.text \"Documento oficial gerado eletronicamente pelo Sistema RU Digital — Universidade de Brasília.\", align: :center","      pdf.text \"Autenticidade: SHA256-#{SecureRandom.hex(16).upcase} | Emitido para Matrícula #{@usuario.matricula}\", align: :center","    end","  end","end"],"lines":[null,null,1,null,null,null,null,null,null,null,null,null,null,null,null,1,1,null,1,null,1,7,7,7,null,null,null,1,5,null,null,null,null,null,5,5,5,5,5,null,5,null,null,1,null,null,1,5,5,5,5,5,5,5,5,5,null,null,null,1,5,5,5,null,5,5,5,null,null,5,5,5,null,null,null,1,5,5,5,null,null,5,5,5,null,5,5,5,null,5,5,5,5,null,null,null,5,5,5,null,null,null,1,5,5,5,null,null,5,5,5,5,null,5,5,5,5,5,5,null,null,5,null,null,5,null,46,1,1,null,null,46,null,null,46,23,23,null,null,null,46,46,46,46,46,46,null,46,3,null,43,null,46,null,null,46,null,null,null,null,1,297,null,null,null,1,5,5,5,5,null,5,5,5,5,null,null,null],"lines_covered_percent":100.0,"covered_lines":99,"missed_lines":0,"omitted_lines":79,"total_lines":99,"branches":[],"branches_covered_percent":100.0,"covered_branches":0,"missed_branches":0,"total_branches":0},"app/services/extrato_service.rb":{"source":["# frozen_string_literal: true","","# ==============================================================================","# Service de Consolidação Contábil do Extrato (app/services/extrato_service.rb)","# ==============================================================================","# Responsável por unificar, em tempo de execução e conforme a 3FN do banco,","# as movimentações financeiras do estudante:","# - Créditos: Recargas pagas (status == 'paga')","# - Débitos: Acessos autorizados aos restaurantes (autorizado == true)","#","# Aplica filtros de período, tipo de refeição/evento e forma de acesso,","# calculando ainda os agregadores dos cards do Figma US04.","# ==============================================================================","class ExtratoService","  # Estrutura unificada representando um lançamento contábil no extrato","  Lancamento = Struct.new(","    :id,","    :tipo_registro, # :recarga ou :acesso","    :data_hora,     # DateTime","    :evento,        # \"Recarga de Saldo\", \"Almoço\", \"Jantar\", \"Café da Manhã\"","    :restaurante,   # \"RU Darcy Ribeiro\", \"Portal Online\"","    :forma_acesso,  # \"QR Code App\", \"Carteirinha Física\", \"PIX Instantâneo\", \"Cartão de Crédito\"","    :tipo_fluxo,    # :credito (+) ou :debito (-)","    :valor_centavos # integer","  ) do","    # Formata o valor monetário com sinal e padrão brasileiro (ex: \"+ R$ 45,00\" ou \"- R$ 4,50\")","    def valor_formatado","      reais = valor_centavos / 100.0","      sinal = credito? ? \"+\" : \"-\"","      \"#{sinal} R$ #{sprintf('%.2f', reais).tr('.', ',')}\"","    end","","    def credito?","      tipo_fluxo == :credito","    end","","    def debito?","      tipo_fluxo == :debito","    end","","    def data_formatada","      data_hora.strftime(\"%d/%m/%Y às %H:%M\")","    end","  end","","  attr_reader :usuario, :filtros","","  def initialize(usuario, filtros = {})","    @usuario = usuario","    @filtros = filtros.to_h.symbolize_keys","  end","","  # Retorna a lista consolidada e filtrada de lançamentos ordenada do mais recente ao mais antigo","  def lancamentos","    @lancamentos ||= consolidar_lancamentos","  end","","  # Indicador 1: Total gasto em acessos autorizados no mês atual (ou no período filtrado)","  def total_gasto_centavos","    lancamentos.select(&:debito?).sum(&:valor_centavos)","  end","","  def total_gasto_formatado","    formatar_moeda(total_gasto_centavos)","  end","","  # Indicador 2: Quantidade de refeições consumidas (acessos) no período","  def refeicoes_realizadas_count","    lancamentos.select(&:debito?).size","  end","","  # Indicador 3: Total recarregado em dinheiro no período","  def total_recarregado_centavos","    lancamentos.select(&:credito?).sum(&:valor_centavos)","  end","","  def total_recarregado_formatado","    formatar_moeda(total_recarregado_centavos)","  end","","  # Saldo atual da carteira do estudante","  def saldo_atual_formatado","    saldo = @usuario.carteira&.saldo_centavos || 0","    formatar_moeda(saldo)","  end","","  def saldo_atual_refeicoes","    saldo = @usuario.carteira&.saldo_centavos || 0","    saldo / 450","  end","","  private","","  # Unifica recargas e acessos em memória e aplica os filtros ativos","  def consolidar_lancamentos","    lista = []","","    # 1. Carrega recargas pagas do estudante","    usuario.recargas.where(status: \"paga\").find_each do |recarga|","      lista \u003c\u003c Lancamento.new(","        \"recarga-#{recarga.id}\",","        :recarga,","        recarga.created_at,","        \"Recarga de Saldo\",","        \"Portal Online\",","        recarga.metodo_pagamento || \"PIX Instantâneo\",","        :credito,","        recarga.valor_centavos","      )","    end","","    # 2. Carrega acessos autorizados do estudante","    usuario.acessos.where(autorizado: true).includes(:turno, catraca: :restaurante).find_each do |acesso|","      turno_nome = acesso.turno&.nome || \"Refeição\"","      restaurante_nome = formatar_restaurante(acesso.catraca&.restaurante)","      forma = acesso.forma_acesso.presence || \"QR Code App\"","","      lista \u003c\u003c Lancamento.new(","        \"acesso-#{acesso.id}\",","        :acesso,","        acesso.data_hora || acesso.created_at,","        turno_nome,","        restaurante_nome,","        forma,","        :debito,","        acesso.valor_pago_centavos || 450","      )","    end","","    # 3. Ordena por data decrescente","    lista.sort_by! { |l| l.data_hora || Time.zone.at(0) }.reverse!","","    # 4. Aplica os filtros recebidos por parâmetro","    aplicar_filtros(lista)","  end","","  def aplicar_filtros(lista)","    resultado = lista","","    # Filtro: Período de Referência","    if filtros[:periodo].present?","      case filtros[:periodo].to_s.downcase","      when /30/","        data_limite = 30.days.ago.beginning_of_day","        resultado = resultado.select { |l| l.data_hora && l.data_hora >= data_limite }","      when /7/","        data_limite = 7.days.ago.beginning_of_day","        resultado = resultado.select { |l| l.data_hora && l.data_hora >= data_limite }","      when /m[eê]s/","        data_limite = Time.current.beginning_of_month","        resultado = resultado.select { |l| l.data_hora && l.data_hora >= data_limite }","      end","    end","","    # Filtro: Tipo de Refeição / Evento","    if filtros[:tipo_refeicao].present? && filtros[:tipo_refeicao] != \"Todas\"","      tipo = filtros[:tipo_refeicao].to_s.downcase","      resultado = resultado.select do |l|","        if tipo.include?(\"recarga\")","          l.credito?","        else","          l.evento.to_s.downcase.include?(tipo)","        end","      end","    end","","    # Filtro: Forma de Acesso","    if filtros[:forma_acesso].present? && filtros[:forma_acesso] != \"Todas\"","      forma = filtros[:forma_acesso].to_s.downcase","      resultado = resultado.select do |l|","        l.forma_acesso.to_s.downcase.include?(forma)","      end","    end","","    resultado","  end","","  # Simplifica o nome do restaurante removendo prefixos longos (ex: \"Restaurante Universitário - \")","  def formatar_restaurante(restaurante)","    return \"Darcy Ribeiro\" unless restaurante","","    nome = restaurante.campus.presence || restaurante.nome.to_s","    nome.sub(/\\A(Restaurante\\s+Universit[aá]rio\\s*-\\s*|RU\\s*-\\s*|RU\\s+)/i, \"\").strip","  end","","  def formatar_moeda(centavos)","    reais = (centavos || 0) / 100.0","    \"R$ #{sprintf('%.2f', reais).tr('.', ',')}\"","  end","end"],"lines":[null,null,null,null,null,null,null,null,null,null,null,null,null,1,null,1,null,null,null,null,null,null,null,null,null,null,1,48,48,48,null,null,1,148,null,null,1,101,null,null,1,47,null,null,null,1,null,1,32,32,null,null,null,1,51,null,null,null,1,8,null,null,1,7,null,null,null,1,7,null,null,null,1,8,null,null,1,7,null,null,null,1,8,8,null,null,1,8,8,null,null,1,null,null,1,29,null,null,29,20,null,null,null,null,null,null,null,null,null,null,null,null,29,59,59,59,null,59,null,null,null,null,null,null,null,null,null,null,null,null,108,null,null,29,null,null,1,29,null,null,29,3,null,1,3,null,1,3,null,1,3,null,null,null,null,29,2,2,4,2,null,2,null,null,null,null,null,29,1,1,2,null,null,null,29,null,null,null,1,59,null,58,58,null,null,1,22,22,null,null],"lines_covered_percent":100.0,"covered_lines":74,"missed_lines":0,"omitted_lines":116,"total_lines":74,"branches":[],"branches_covered_percent":100.0,"covered_branches":0,"missed_branches":0,"total_branches":0},"app/services/notificar_resultado_fastpass.rb":{"source":["class NotificarResultadoFastpass","  def self.call(agora: Time.current)","    agora = agora.in_time_zone(\"America/Sao_Paulo\")","    SorteioFastpass.where(status: \"realizado\", data_sorteio: agora.to_date..(agora.to_date + 1)).find_each do |sorteio|","      programado = sorteio.horario_notificacao","      next unless agora >= programado && agora \u003c programado + 1.minute","","      sorteio.with_lock do","        next unless sorteio.status == \"realizado\"","","        sorteio.inscricoes_fastpass.includes(:usuario).find_each do |inscricao|","          next unless inscricao.usuario.papel == \"estudante\"","          next unless [ \"sorteado\", \"nao_sorteado\" ].include?(inscricao.status)","","          sorteio.notificacoes.find_or_create_by!(usuario: inscricao.usuario, tipo: \"fastpass\") do |notificacao|","            mensagem = if inscricao.status == \"sorteado\"","              \"Você foi sorteado para o FastPass. Horário do FastPass: #
